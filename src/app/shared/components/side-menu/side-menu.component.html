<div class="container-fluid bg-light p-2">
  <div class="row">
    <div class="col-12" *ngFor="let item of this.side_menu" class="d-flex justify-content-left align-items-center">
      <ion-icon name="{{ item.icon }}" class="text-black m-2" style="--background: none;"></ion-icon>
      <ion-label>
        <p class="text-black">{{ item.name }}</p>
      </ion-label>
    </div>
  </div>
</div>
