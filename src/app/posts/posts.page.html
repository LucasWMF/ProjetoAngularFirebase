<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Posts</ion-title>

    <ion-buttons slot="end">
      <ion-button routerLink="/profile">Perfil</ion-button>
      <ion-button (click)="logout()">Sair</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding feed-container">

  <!-- Form de novo post -->
  <ion-card class="post-form">
    <ion-card-content>
      <ion-item>
        <ion-input [(ngModel)]="newPostDescription" placeholder="Escreva algo..."></ion-input>
      </ion-item>

      <ion-item>
        <ion-input [(ngModel)]="newPostPicture" placeholder="Link da imagem (opcional)"></ion-input>
      </ion-item>

      <ion-button expand="block" (click)="createPost(newPostDescription, newPostPicture)">
        Postar
      </ion-button>
    </ion-card-content>
  </ion-card>

  <!-- Lista de posts estilo chat -->
  <ion-list>
    <ion-item *ngFor="let post of posts" lines="none">
      <ion-avatar slot="start" *ngIf="post.user?.picture">
        <img [src]="post.user.picture">
      </ion-avatar>

      <ion-label class="post-bubble">
        <h3>{{ post.user?.name }}</h3>
        <p>{{ post.description }}</p>

        <img *ngIf="post.picture" [src]="post.picture" 
             style="max-width: 100%; margin-top: 5px; border-radius: 8px;">

        <small>{{ post.created_at | date:'short' }}</small>
      </ion-label>
    </ion-item>
  </ion-list>

</ion-content>
