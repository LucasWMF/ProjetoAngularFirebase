<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Feed</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list>
    <ion-item *ngFor="let post of posts">
      <ion-label>
        <h2>{{ post.user.name }}</h2>
        <p>{{ post.content }}</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
