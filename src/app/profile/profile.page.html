<ion-header id="profile-header">
  <ion-toolbar color="primary">
    <ion-title>Perfil</ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="/posts">Posts</ion-button>
      <ion-button (click)="logout()">Sair</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="custom-content ion-padding" id="profile-content">
  <div class="profile-header">
    <ion-avatar slot="start">
      <img [src]="getUserColorFile(user?.name)">
    </ion-avatar>
    <h2>{{ user?.name }}</h2>
    <p>{{ user?.email }}</p>
    <p>Membro desde: {{ user?.created_at | date:'MMM yyyy' }}</p>
  </div>

  <ion-card>
    <ion-card-header>
      <ion-card-title>Minhas Postagens</ion-card-title>
    </ion-card-header>

    <ion-list>

      <ion-item *ngFor="let post of posts">
        <ion-avatar slot="start">
          <img [src]="getUserColorFile(post.user.name)">
        </ion-avatar>

        <ion-label>
          <h2>{{ post.user?.name }}</h2>
          <p>{{ post.description }}</p>

          <img *ngIf="post.picture" [src]="post.picture" class="post-image">

          <p class="post-time">
            {{ getRelativeTime(post.created_at) }}
          </p>
        </ion-label>
      </ion-item>

    </ion-list>
  </ion-card>
</ion-content>
